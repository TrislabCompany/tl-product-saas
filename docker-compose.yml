# The whole product locally from the four Dockerfiles, for someone without the
# .NET SDK: docker compose up --build. With the SDK, the AppHost is the everyday
# run (docs/getting-started.md). The services are named like the apps in
# platform.yaml and the stamp's container services, so the front ends reach
# http://api:8080 and http://storage:9000 as they reach http://ca-<stamp>-api
# and http://ca-<stamp>-storage:9000 in a stamp. Like a dev stamp, it has
# Postgres and storage but no cache: the API runs on its in-memory cache. The
# settings come from .env, a copy of .env.example. The images restore the Trislab
# packages from GitHub Packages: export PACKAGES_TOKEN (a token with read:packages) first.
#
# Many products run side by side (docs/local-ports.md): each has its own project
# name, so its own volumes, and its own ports and database from .env. The profile
# own-db (the default, in COMPOSE_PROFILES) starts this product's Postgres;
# without it, DATABASE_URL points to a Postgres that is already running, and the
# migrator creates the database. The profile aspire adds the Aspire dashboard
# for logs, traces and metrics.
name: tl-product-saas

services:
  postgres:
    # The same Postgres as a dev stamp.
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    profiles: [own-db]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  storage:
    # The same S3-compatible storage as a dev stamp. The migrator creates the
    # bucket storage, which a stamp's storage service creates itself.
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The init container of api in a stamp: it finishes before api starts.
  migrator:
    build: { context: ., dockerfile: src/Host/App.DbMigrator/Dockerfile, secrets: [packages] }
    environment: &api-settings
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      HANGFIRE_PASSWORD: ${HANGFIRE_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      # Not required: with a shared Postgres, this product's own does not run.
      postgres: { condition: service_healthy, required: false }
      storage: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: src/Host/App.Api/Dockerfile, secrets: [packages] }
    environment: *api-settings
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrator: { condition: service_completed_successfully }

  admin:
    build: { context: clients/admin, dockerfile: Dockerfile, secrets: [packages] }
    environment:
      API_UPSTREAM: http://api:8080
      STORAGE_UPSTREAM: http://storage:9000
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8091}:8080"
    depends_on:
      - api

  dashboard:
    build: { context: clients/dashboard, dockerfile: Dockerfile, secrets: [packages] }
    environment:
      API_UPSTREAM: http://api:8080
      STORAGE_UPSTREAM: http://storage:9000
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
      PUBLIC_DEMO_MODE: ${SEED_DEMO}
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    depends_on:
      - api

  # Logs, traces and metrics of api and migrator, on http://localhost:${ASPIRE_PORT}
  # with the profile aspire; they send them by OTLP when
  # OTEL_EXPORTER_OTLP_ENDPOINT is http://aspire-dashboard:18889 (.env.example).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.4@sha256:23411f715be2476da0b2c0ad110039237de657c6cae31bf5c587d12a26c11230
    profiles: [aspire]
    environment:
      # Local only, bound to 127.0.0.1: no sign-in to the dashboard.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${ASPIRE_PORT:-18889}:18888"

secrets:
  packages:
    environment: PACKAGES_TOKEN

volumes:
  postgres:
  storage:
