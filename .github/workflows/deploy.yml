name: deploy

# Builds, scans and pushes every image in platform.yaml once per commit, with
# its SBOM, and deploys it to every dev tier Environment, on every push to main
# and by hand. Run by hand on a commit whose images exist, it builds nothing
# and deploys those. All steps live in the reusable workflow in tl-platform,
# pinned by tag. The Trislab packages are restored with the organisation secret
# PACKAGES_READ_TOKEN, or the workflow's token without it (packages: read is part
# of packages: write), as in ci.yml. Change nothing here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: TrislabCompany/tl-platform/.github/workflows/app-deploy.yml@app-workflows/v0.6.0
    secrets:
      packages-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
